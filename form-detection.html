<!DOCTYPE html>
<!--
  Versteckte Formular-Kopie ausschließlich zur Netlify-Formularerkennung beim Build.
  Netlify scannt statisches HTML nach data-netlify-Formularen. Da das echte Formular
  in kontakt.html per JavaScript (fetch) gesendet wird, sorgt diese Datei dafür, dass
  Netlify alle Feldnamen zuverlässig registriert ("Form not found"-Fehler vermeiden).
  Diese Seite wird nicht verlinkt und ist für Besucher nicht sichtbar.
-->
<html lang="de">
<head><meta charset="utf-8"><title>&nbsp;</title><meta name="robots" content="noindex"></head>
<body>
  <form name="anfrage" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
    <input type="hidden" name="form-name" value="anfrage">
    <input name="bot-field">
    <input type="text" name="name">
    <input type="tel" name="telefon">
    <input type="email" name="email">
    <input type="text" name="objektadresse">
    <textarea name="anschrift"></textarea>
    <input type="text" name="objektart">
    <input type="number" name="flaeche">
    <input type="number" name="raeume">
    <input type="number" name="baujahr">
    <input type="text" name="etage[]">
    <input type="text" name="bodenbelag">
    <input type="text" name="belag-entfernt">
    <input type="text" name="estrichart[]">
    <input type="text" name="risse">
    <input type="text" name="verteiler">
    <input type="text" name="heizungsbauer">
    <input type="text" name="waermeerzeuger">
    <input type="text" name="baustrom">
    <input type="text" name="zeitraum">
    <input type="file" name="fotos">
    <input type="file" name="grundriss">
    <textarea name="nachricht"></textarea>
    <input type="checkbox" name="datenschutz">
  </form>
</body>
</html>
